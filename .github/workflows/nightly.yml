name: Nightly

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PITCHEE_KEYSTORE_BASE64: ${{ secrets.PITCHEE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          TAG="nightly-$(date -u +%Y%m%d-%H%M)"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          VERSION_NAME="nightly-$SHORT_SHA"
          # Keep version metadata stable for the same commit so identical
          # builds produce identical APK hashes across nightly runs.
          VERSION_CODE="$(git show -s --format=%ct HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        shell: bash
        env:
          PITCHEE_STORE_PASSWORD: ${{ secrets.PITCHEE_STORE_PASSWORD }}
          PITCHEE_KEY_ALIAS: ${{ secrets.PITCHEE_KEY_ALIAS }}
          PITCHEE_KEY_PASSWORD: ${{ secrets.PITCHEE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$PITCHEE_KEYSTORE_BASE64" ] && [ -n "$PITCHEE_STORE_PASSWORD" ] && [ -n "$PITCHEE_KEY_ALIAS" ] && [ -n "$PITCHEE_KEY_PASSWORD" ]; then
            echo "$PITCHEE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pitchee-release.jks"
            echo "PITCHEE_KEYSTORE_PATH=$RUNNER_TEMP/pitchee-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        id: build
        shell: bash
        env:
          PITCHEE_STORE_PASSWORD: ${{ secrets.PITCHEE_STORE_PASSWORD }}
          PITCHEE_KEY_ALIAS: ${{ secrets.PITCHEE_KEY_ALIAS }}
          PITCHEE_KEY_PASSWORD: ${{ secrets.PITCHEE_KEY_PASSWORD }}
        run: |
          if [ -n "$PITCHEE_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease \
              -PversionName="${{ steps.version.outputs.version_name }}" \
              -PversionCode="${{ steps.version.outputs.version_code }}"
            APK_DIR="app/build/outputs/apk/release"
          else
            ./gradlew assembleDebug \
              -PversionName="${{ steps.version.outputs.version_name }}" \
              -PversionCode="${{ steps.version.outputs.version_code }}"
            APK_DIR="app/build/outputs/apk/debug"
          fi
          echo "apk_dir=$APK_DIR" >> "$GITHUB_OUTPUT"

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          prerelease: true
          make_latest: false
          files: ${{ steps.build.outputs.apk_dir }}/*.apk
