name: Nightly

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PITCHEE_KEYSTORE_BASE64: ${{ secrets.PITCHEE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for changes
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=30" | jq -r '[.[] | select(.draft == false)][0].tag_name // empty')"
          if [ -z "$latest_tag" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote_sha="$(git ls-remote origin "refs/tags/$latest_tag^{}" | awk '{print $1}')"
          if [ -z "$remote_sha" ]; then
            remote_sha="$(git ls-remote origin "refs/tags/$latest_tag" | awk '{print $1}')"
          fi
          head_sha="$(git rev-parse HEAD)"

          if [ "$remote_sha" = "$head_sha" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.changes.outputs.should_build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        if: steps.changes.outputs.should_build == 'true'
        id: version
        shell: bash
        run: |
          NAME="nightly-$(date -u +%Y%m%d-%H%M)"
          CODE="$(date -u +%Y%m%d%H)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        if: steps.changes.outputs.should_build == 'true'
        shell: bash
        env:
          PITCHEE_STORE_PASSWORD: ${{ secrets.PITCHEE_STORE_PASSWORD }}
          PITCHEE_KEY_ALIAS: ${{ secrets.PITCHEE_KEY_ALIAS }}
          PITCHEE_KEY_PASSWORD: ${{ secrets.PITCHEE_KEY_PASSWORD }}
        run: |
          if [ -n "$PITCHEE_KEYSTORE_BASE64" ] && [ -n "$PITCHEE_STORE_PASSWORD" ] && [ -n "$PITCHEE_KEY_ALIAS" ] && [ -n "$PITCHEE_KEY_PASSWORD" ]; then
            echo "$PITCHEE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pitchee-release.jks"
            echo "PITCHEE_KEYSTORE_PATH=$RUNNER_TEMP/pitchee-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        if: steps.changes.outputs.should_build == 'true'
        id: build
        shell: bash
        env:
          PITCHEE_STORE_PASSWORD: ${{ secrets.PITCHEE_STORE_PASSWORD }}
          PITCHEE_KEY_ALIAS: ${{ secrets.PITCHEE_KEY_ALIAS }}
          PITCHEE_KEY_PASSWORD: ${{ secrets.PITCHEE_KEY_PASSWORD }}
        run: |
          if [ -n "$PITCHEE_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease \
              -PversionName="${{ steps.version.outputs.name }}" \
              -PversionCode="${{ steps.version.outputs.code }}"
            echo "apk_dir=app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug \
              -PversionName="${{ steps.version.outputs.name }}" \
              -PversionCode="${{ steps.version.outputs.code }}"
            echo "apk_dir=app/build/outputs/apk/debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish nightly release
        if: steps.changes.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: ${{ steps.version.outputs.name }}
          prerelease: true
          files: ${{ steps.build.outputs.apk_dir }}/*.apk
